name: Security

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  lockfile-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # pnpm/action-setup v4.1.0
      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f9e0f3d3fe3b5ed3e72

      - name: Lint lockfile
        run: "npx lockfile-lint --path pnpm-lock.yaml --allowed-hosts npm --allowed-schemes https:"
